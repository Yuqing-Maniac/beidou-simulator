name: Windows test release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.4.0-test
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build Windows packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:win
      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $app = Start-Process -FilePath "$PWD/release/win-unpacked/beidou-simulator.exe" -ArgumentList '--disable-gpu', '--enable-logging=stderr' -RedirectStandardError startup-stderr.log -RedirectStandardOutput startup-stdout.log -PassThru
          Start-Sleep -Seconds 7
          $app.Refresh()
          if ($app.HasExited) {
            Get-Content startup-stderr.log, startup-stdout.log -ErrorAction SilentlyContinue
            throw "Application exited during startup: $($app.ExitCode)"
          }
          Get-Process -Name beidou-simulator -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Checksum and publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          $packages = @(Get-ChildItem release/*-win-x64.exe, release/*-win-x64.zip)
          if ($packages.Count -ne 2) { throw 'Expected EXE and ZIP packages' }
          $checksums = $packages | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name }
          $checksums | Set-Content release/SHA256SUMS.txt -Encoding ascii
          gh release upload $env:RELEASE_TAG $packages[0].FullName $packages[1].FullName release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release upload $env:RELEASE_TAG docs/media/opening.mp4 docs/media/opening.png public/startup.wav --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Preview upload failed' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
